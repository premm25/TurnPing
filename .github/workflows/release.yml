name: release

# Builds the Windows distribution when a version tag is pushed and attaches it to a
# DRAFT GitHub release. A maintainer reviews and publishes the draft manually.
# The executables are not code-signed (no certificate is configured).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Python python -Venv "$env:RUNNER_TEMP\venv"
      - uses: actions/upload-artifact@v4
        with:
          name: AgentPing-win64
          path: |
            dist/*.zip
            dist/*.zip.sha256
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.zip
            dist/*.zip.sha256
