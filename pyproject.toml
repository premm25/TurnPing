[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turnping"
version = "0.1.0"
description = "One ping. Every agent. Local-first desktop notifications for AI coding agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "TurnPing contributors" }]
keywords = ["notifications", "claude-code", "codex", "gemini-cli", "developer-tools", "windows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "pydantic>=2.7,<3",
    "tomli-w>=1.0",
    "PySide6-Essentials>=6.8",
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Data.Xml.Dom>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.10",
    "pyinstaller>=6.10",
]

[project.scripts]
turnping = "turnping.cli:main"

[project.gui-scripts]
turnping-app = "turnping.cli:gui_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
turnping = ["desktop/assets/*.png", "desktop/assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "windows: requires a real Windows desktop session",
    "real_os: touches real OS facilities (registry, notifications); opt-in via TURNPING_REAL_OS_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "S603",   # subprocess without shell: we always pass argument lists
    "S607",   # partial executable paths are resolved deliberately (e.g. "code")
    "RUF012",
    "SIM105", # try/except/pass is clearer than contextlib.suppress for best-effort cleanup
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120  # the formatter wraps code at 100; long literals may run to 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"src/turnping/desktop/theme.py" = ["E501"]  # Qt stylesheet rules read best on one line

[tool.mypy]
python_version = "3.12"
files = ["src/turnping"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
